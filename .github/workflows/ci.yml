name: CI

# MonoGame 판(game/, Packages/com.rootborn.core, Tools/) 기준 CI. Unity 판은 얼렸고(태그 unity-playable-20261111)
# Unity 테스트는 돌리지 않는다. 같은 검사를 로컬에서는 `bash Scripts/ci/run-all.sh`로 돌린다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: 정적 검사 (Scripts/ci)
    runs-on: ubuntu-latest
    steps:
      # LFS는 쓰지 않는다: 저장소에 filter=lfs 규칙(.gitattributes)이 없다. 그래서 lfs 옵션을 켜지 않는다.
      - uses: actions/checkout@v4
      - name: 검사 스크립트 자체 시험
        run: bash Scripts/ci/tests/run-tests.sh
      - name: 검사 (Core 참조, MonoGame 참조, 엔티티 id 분기, 한글 문구, 현지화 키, .meta)
        run: bash Scripts/ci/run-all.sh --checks-only

  dotnet-tests:
    name: dotnet 테스트 (Core, DataExport, game — Host 제외)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core 규칙 테스트
        run: dotnet test Tools/Rootborn.Core.Tests
      - name: 데이터 변환기 테스트
        run: dotnet test Tools/Rootborn.DataExport.Tests
      # Host 테스트는 실제 창을 띄우므로 아래 별도 job에서 돌린다. 나머지 프로젝트는 창이 필요 없다.
      - name: game 테스트 (Host.Tests 제외)
        run: |
          set -euo pipefail
          for proj in game/tests/*/*.csproj; do
            case "$proj" in *Rootborn.Host.Tests*) continue ;; esac
            dotnet test "$proj"
          done

  host-tests:
    name: Host 테스트 (실제 창, xvfb)
    runs-on: ubuntu-latest
    # 막지 않는다(continue-on-error): Host 테스트는 SDL로 실제 창을 띄우고 장치 입력을 주입한다.
    # GitHub ubuntu 러너에서 가상 화면(xvfb)과 OpenGL(소프트웨어 렌더링)로 돌 수 있는지는 아직 확인하지 못했다.
    # 돌아가는 것이 확인되면 이 줄을 지워 다른 job처럼 실패 시 막게 한다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 창에 필요한 시스템 라이브러리
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libsdl2-2.0-0 libopenal1 libgl1 libglu1-mesa mesa-utils libegl1
      - name: game 전체 솔루션 테스트 (Host 포함)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" dotnet test game/Rootborn.sln
