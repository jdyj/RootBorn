name: CI

# MonoGame 판(game/ — Core 규칙 game/Rootborn.Core 포함, Tools/) 기준 CI. Unity 판은 저장소에서 지웠다(태그 unity-playable-20261111에 있다). 같은 검사를 로컬에서는 `bash Scripts/ci/run-all.sh`로 돌린다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # main 에 연달아 푸시해도 앞 실행을 취소하지 않는다(2026-11-11 main 43026837837 이 취소돼 그 커밋의 결과가 없었다).
  # 같은 PR 의 낡은 실행만 취소한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-checks:
    name: 정적 검사 (Scripts/ci)
    runs-on: ubuntu-latest
    steps:
      # LFS는 쓰지 않는다: 저장소에 filter=lfs 규칙(.gitattributes)이 없다. 그래서 lfs 옵션을 켜지 않는다.
      - uses: actions/checkout@v4
      - name: 검사 스크립트 자체 시험
        run: bash Scripts/ci/tests/run-tests.sh
      - name: 검사 (Core 참조, MonoGame 참조, 엔티티 id 분기, 한글 문구, 현지화 키, Host 묶음)
        run: bash Scripts/ci/run-all.sh --checks-only

  dotnet-tests:
    name: dotnet 테스트 (game/tests — Core 포함, Host 제외)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Host 테스트는 실제 창을 띄우므로 아래 별도 job에서 돌린다. 나머지 프로젝트는 창이 필요 없다.
      - name: game 테스트 (Host.Tests 제외)
        # 한 프로젝트가 실패해도 나머지를 끝까지 돌려 실패를 한꺼번에 보이고, 실패가 하나라도 있으면 job 이 실패한다.
        run: |
          set -uo pipefail
          failed=0
          for proj in game/tests/*/*.csproj; do
            case "$proj" in *Rootborn.Host.Tests*) continue ;; esac
            dotnet test "$proj" || { echo "::error::실패: $proj"; failed=1; }
          done
          exit $failed

  host-tests:
    name: Host 테스트 ${{ matrix.shard }} (실제 창, xvfb)
    runs-on: ubuntu-latest
    # 막는다(2026-11-12부터 continue-on-error 없음): Host 테스트는 SDL로 실제 창을 띄우고 장치 입력을 주입한다. 떼는 조건과 판단은 Scripts/ci/README.md.
    # 한 job 으로 돌리면 러너(2 코어쯤, 소프트웨어 GL)에서 테스트 단계만 28~29분이었다(main 43022156721, 43027519152).
    # 그래서 클래스 이름으로 묶음을 나눠 동시에 돌린다: 정의는 Scripts/ci/host-test-shards.txt, 겹침·빠짐 검사는
    # Scripts/ci/check-host-test-shards.sh(static-checks job). 마지막 묶음(rest)은 다른 묶음에 적지 않은 전부라 새 테스트가 빠지지 않는다.
    # 묶음 이름을 바꾸면 아래 matrix 도 같이 바꾼다(검사가 정의 파일과 이 목록을 맞춰 본다).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [soak, play, two-games, main-chain, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # apt 미러의 DNS 가 안 될 때 apt 가 20분쯤 재시도하다 실패했다(main 43043641815, 43052911168 — 테스트는 돌지 않음).
      # 한 번에 5분까지만 기다리고 세 번까지 다시 한다.
      - name: 창에 필요한 시스템 라이브러리와 한글 글꼴
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            if timeout 300 sudo apt-get update -o Acquire::Retries=2               && timeout 300 sudo apt-get install -y -o Acquire::Retries=2 xvfb libsdl2-2.0-0 libopenal1 libgl1 libglu1-mesa mesa-utils libegl1 fonts-nanum; then
              break
            fi
            echo "::warning::apt 실패 ${i}번째, 다시 한다"
            sleep 20
          done
          test -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      - name: 이 묶음의 테스트 필터
        id: shard
        run: |
          bash Scripts/ci/check-host-test-shards.sh
          echo "filter=$(bash Scripts/ci/host-test-shards.sh filter '${{ matrix.shard }}')" >> "$GITHUB_OUTPUT"
      # 나머지 테스트 프로젝트는 dotnet-tests job이 돌리므로 여기서는 Host 테스트만 돌린다.
      # 통과한 테스트도 시간과 함께 로그에 남긴다(verbosity=normal). trx 는 묶음마다 올려 묶음 균형을 맞추는 데 쓴다.
      - name: Host 테스트
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          # 러너의 글꼴 위치. 테스트가 운영체제 글꼴 찾기에 기대지 않게 직접 준다(배포용 글꼴은 사용자 결정 대기).
          ROOTBORN_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          dotnet test game/tests/Rootborn.Host.Tests
          --filter "${{ steps.shard.outputs.filter }}"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=host-${{ matrix.shard }}.trx"
          --results-directory host-test-results
      - name: Host 테스트 결과(trx) 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-results-${{ matrix.shard }}
          path: host-test-results/
          if-no-files-found: ignore
          retention-days: 14

  server-publish:
    name: 서버 배포 폴더 만들고 확인 (linux-x64)
    runs-on: ubuntu-latest
    # GitHub 러너에서 두 번 연속 통과했다(main 43022156721, 43027519152 — 각 35~50초). 그래서 다른 job 처럼 실패 시 막는다.
    # 서버는 창·그림·글꼴이 필요 없어 Host 처럼 xvfb·글꼴 설치가 없다. 듣는 주소는 루프백(시험용, 밖에 열리지 않음)이다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 배포 스크립트 문법
        run: for f in Tools/publish/*.sh; do bash -n "$f"; done
      - name: 서버 배포 폴더 만들기
        run: bash Tools/publish/publish.sh --server linux-x64
      - name: 서버 배포 폴더 확인 (저장소 밖 복사본에서 듣기 → stop → 저장 → 이어서 열기)
        run: bash Tools/publish/verify.sh --server linux-x64
